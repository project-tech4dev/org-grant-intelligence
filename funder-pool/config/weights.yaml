# Ranking weights per category. Each category sums to 100.
# Method: for each signal, take the percentile rank (0 to 1) within the category, multiply by the weight, and sum.
# Unknown signal: use half the category median percentile and set unknown_signals in signals.csv.
# These are starting values. Change them after reading the first distribution report.
method: percentile_within_category
unknown_signal_penalty: 0.5

