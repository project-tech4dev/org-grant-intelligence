    aliases: [DEPwD, "Ministry of Social Justice and Empowerment (DEPwD)"]
    schemes:
      - scheme: Deendayal Disabled Rehabilitation Scheme (DDRS)
        page: https://depwd.gov.in/en/ddrs/
      - scheme: Scheme for Implementation of the Rights of Persons with Disabilities Act (SIPDA)
        page: https://depwd.gov.in/en/schemes/
        section: SIPDA
      - scheme: National Action Plan for Skill Development of PwDs (NAP-SDP)
        page: https://depwd.gov.in/en/schemes/
        section: NAP
