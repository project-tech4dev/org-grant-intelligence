# government_india: agencies (funders) and the scheme pages read for them.
# Each URL was checked on 2026-11-25 (Phase 5). The funder is the agency; schemes become programmes (help file §8).
# page: the URL read. section: for a page that covers several schemes, a phrase that starts the scheme's text
# (the text up to the next scheme's phrase is used). roster_only: home page, read for the agency's existence only.
agencies:
  - name: Ministry of Tribal Affairs
    aliases: [MoTA]
    schemes:
      - scheme: Grants-in-aid to Voluntary Organisations working for the welfare of Scheduled Tribes
        page: https://tribal.nic.in/NGO.aspx
