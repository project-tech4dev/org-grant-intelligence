services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Keep the SQLite checkpointer on a named volume so threads survive restarts.
      - CHECKPOINT_DB=/data/checkpoints.sqlite
      - DOWNLOADS_DIR=/data/downloads
      - PLAYWRIGHT_MCP_URL=http://playwright:8931/mcp
    depends_on:
      playwright:
        condition: service_started
    volumes:
      - checkpoints:/data
      # Files the agent downloads land here on your machine.
      - ./downloads:/data/downloads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  playwright:
    # Official Playwright MCP server: headless browser tools for JS-rendered
    # sites and portals that block plain HTTP fetching.
    image: mcr.microsoft.com/playwright/mcp:latest
    # allowed-hosts must include the compose-network hostname the backend uses;
    # the service is not published to the host machine, so this stays internal.
    command: ["--headless", "--isolated", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "playwright:8931"]
    init: true

  frontend:
    build: ./frontend
    ports:
      - "3005:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  checkpoints:
