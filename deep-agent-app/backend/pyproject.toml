[project]
name = "deep-agent-backend"
version = "0.1.0"
description = "Deep Agents app: provider-agnostic deep agent with web + GitHub MCP tools, served over SSE"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2,<0.4",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-tavily>=0.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
